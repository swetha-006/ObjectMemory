services:
  - type: web
    name: objectmemory
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OBJECTMEMORY_JWT_SECRET
        generateValue: true
      - key: ENABLE_DEMO_ACCOUNT
        value: "false"
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: MARKET_GL
        value: in
      - key: MARKET_HL
        value: en
      - key: MARKET_GOOGLE_DOMAIN
        value: google.co.in
