services:
  - type: web
    name: objectmemory
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: objectmemory-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: OBJECTMEMORY_DATA_DIR
        value: /var/data
      - key: OBJECTMEMORY_UPLOAD_DIR
        value: /var/data/uploads
      - key: OBJECTMEMORY_JWT_SECRET
        generateValue: true
      - key: ENABLE_DEMO_ACCOUNT
        value: "false"
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: MARKET_GL
        value: in
      - key: MARKET_HL
        value: en
      - key: MARKET_GOOGLE_DOMAIN
        value: google.co.in
